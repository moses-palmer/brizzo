[package]
name = "brizzo"
version = "0.1.0"
authors = ["Moses Palmér <mosespalmer@gmail.com>"]
edition = "2018"

[dependencies]
actix-http = "3.22"
actix-web = "4.20"
env_logger = "0.11"
log = "0.4"
r2d2 = "0.8"
rand = "0.10"
rmp-serde = "1.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1"
toml = "1.2"

[dependencies.actix-session]
version = "0.11"
features = ["redis-session"]

[dependencies.maze]
git = "https://github.com/moses-palmer/labyru"
default-features = false
features = ["serde"]
rev = "v3.1.1"

[dependencies.maze-tools]
git = "https://github.com/moses-palmer/labyru"
rev = "v3.1.1"

[dependencies.redis]
version = "1.8"
features = ["r2d2"]
